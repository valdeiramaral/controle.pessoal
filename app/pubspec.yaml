name: controle_pessoal
description: Controle pessoal de financas, saude e compromissos (Android e iOS).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  uuid: ^4.4.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.2
  file_saver: ^0.7.0
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
  assets:
    - assets/bancos/
