# Banco PostgreSQL e API do app de controle pessoal.
# Na primeira subida cria o banco, carrega banco/schema.sql e cria o papel
# "app_api" (sem privilegios de dono, para a seguranca por linha valer).
# Os dados ficam no volume "dados_postgres" e sobrevivem a "docker compose down".
name: controle-pessoal

services:
  db:
    image: postgres:16
    container_name: controle_pessoal_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controle_pessoal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      APP_API_SENHA: ${APP_API_SENHA:?defina APP_API_SENHA no arquivo .env}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      - ./banco/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./banco/init/02-papel-api.sh:/docker-entrypoint-initdb.d/02-papel-api.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # API (Node.js): cadastro, login e administracao de usuarios. Conecta ao banco
  # com o papel app_api (sem privilegios de dono), entao a RLS vale.
  api:
    build: ./api
    container_name: controle_pessoal_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_DB_HOST: db
      API_DB_PORTA: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-controle_pessoal}
      APP_API_SENHA: ${APP_API_SENHA:?defina APP_API_SENHA no arquivo .env}
      # Sem JWT_SECRET a API recusa subir, com mensagem clara (o iniciar.ps1 o cria).
      JWT_SECRET: ${JWT_SECRET:-}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${API_PORTA:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  dados_postgres:
